<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        li{
            list-style: none;
        }
        .box{
            margin: 50px auto;
            width: 1200px;
            height: 420px;
            background-color: #ddd;
            border-radius: 10px;
        }
        .box ul{
            padding: 90px 40px 90px 60px;
            height: 420px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-content: space-between;
        }
        .box li{
            width: 500px;
            height: 88px;
            background-color: pink;
            display: flex;
        }
        .pic{
            margin-right: 15px;

        }
        .box h3{
            height: 40px;
            color: #333;
        }
        .box p{
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="box">
        <ul>
            <li>
                <div class="pic"><img src="../../../../../相册/无限暖暖/Snipaste_2025-10-16_13-22-58.png" alt="" height="88px"></div>
                <div class="text">
                    <h3>无限暖暖</h3>
                    <p>无限暖暖是一款有跌至开发的游戏</p>
                </div>
            </li>
            <li>
                <div class="pic"><img src="../../../../../相册/地平线/地平线4/Snipaste_2025-06-02_13-11-24.png" alt="" height="88px"></div>
                <div class="text">
                    <h3>地平线4</h3>
                    <p>地平线4是一款有微软开发的赛车游戏</p>
                </div>
            </li>
            <li>
                <div class="pic"><img src="../../../../../相册/明末渊虚之羽/Snipaste_2025-11-25_19-38-00.png" alt="" height="88px"></div>
                <div class="text">
                    <h3>明末渊虚之羽</h3>
                    <p>明末渊虚之羽是由灵泽开发的类魂游戏</p>
                </div>
            </li>
            <li>
                <div class="pic"><img src="../../../../../相册/艾尔登法环/Snipaste_2025-11-10_17-43-43.png" alt="" height="88px"></div>
                <div class="text">
                    <h3>艾尔登法环</h3>
                    <p>艾尔登法环是有fs社开发的混油集大成之作</p>
                </div>
            </li>
            
        </ul>
    </div>
</body>
</html>
