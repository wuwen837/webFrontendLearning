<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 200px;
            height: 200px;
            background-color: pink;

            padding: 20px;
            /* 内边距 */

            border: 1px solid #000;
            /* 边框线 */
            /* solid实线 dashed虚线 dotted点线 */
            /* border-top只设置上边框线 */
            /* right bottom left */
            /* padding,margin也可以这样用 */

            /* margin: 50px; */
            /* 外边距 */
            /* 多值写法与padding相同 */
            /* 左右居中 */
            margin: 0 auto;


            /* padding多值写法   顺时针 上 右 下 左 */
            padding: 10px 20px 40px 80px;
            /* 三值写法  上  左右相同  下 */
            padding: 10px 20px 30px;
            /* 二值   上下相同    左右相同 */
            padding: 10px 20px;

            /* 盒子尺寸 = 内容尺寸 + border尺寸 + 内边距尺寸 */
            /* 内减模式  无需手动剑法*/
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div>div标签</div>
</body>
</html>
