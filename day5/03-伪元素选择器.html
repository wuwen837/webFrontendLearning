<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用来摆放装饰性内容</title>
    <style>
        div{
            width: 300px;
            height: 300px;
            background-color: pink;
        }

        div::before{
            content:"老鼠"
        }
        div::after{
            content: "大米";
        }
    </style>
</head>
<body>
    <div>爱</div>
</body>
</html>
