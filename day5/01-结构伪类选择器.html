<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 对ul中的第一个li执行 */
        li:first-child{
            background-color: green;
        }

        /* 对ul中的最后一个li执行 */
        li:last-child{
            background-color: red;
        }

        /* 对ul中的第3个li执行 */
        ul:nth-child(3){
            background-color: yellow;
        }

        /* E:nth-child() */
    </style>
</head>
<body>
    <ul>
        <li>li 1</li>
        <li>li 2</li>
        <li>li 3</li>
        <li>li 4</li>
        <li>li 5</li>
        <li>li 6</li>
        <li>li 7</li>
        <li>li 8</li>
    </ul>
</body>
</html>
