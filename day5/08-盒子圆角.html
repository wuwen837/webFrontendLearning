<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒子圆角</title>
    <style>
        div{
            width: 300px;
            height: 20px;
            margin: 50px auto;
            padding: 0 ;
            text-align: center;
            font-size: 16px;
            border:1px solid #00000055;
            box-sizing: border-box;
            height: 20px;
            line-height: 20px;

            border-radius: 10px;
            /* 圆角，border-radius:圆角半径; */
            /* 从左上角顺时针赋值，一个值就都一样 */

            box-shadow: 1px 1px;
            /* 阴影     属性值：x偏移 y偏移 模糊半径 扩散半径 颜色 内/外（默认） */
        }
    </style>
</head>
<body>
    <div>搜索内容</div>
</body>
</html>
